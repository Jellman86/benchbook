version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
