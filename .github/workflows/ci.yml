name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install Typst
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf /tmp/typst.tar.xz --strip-components=1 -C "$HOME/.local/bin" typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore, with dependency audit
        run: dotnet restore Hortiplanner.slnx
      - name: Check formatting
        run: dotnet format Hortiplanner.slnx --verify-no-changes --no-restore
      - name: Build, treating warnings and analyser findings as errors
        run: dotnet build Hortiplanner.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution Hortiplanner.slnx --configuration Release --no-build
      - name: Check the API contract is current
        run: |
          dotnet build src/Hortiplanner.Api --configuration Release --no-restore -p:OpenApiGenerateDocumentsOnBuild=true
          git diff --exit-code web/src/api/openapi.json

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse changes to migrations that are already merged
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$GITHUB_BASE_REF...HEAD" -- src/Hortiplanner.Api/Data/Migrations ':!src/Hortiplanner.Api/Data/Migrations/HortiplannerDbContextModelSnapshot.cs')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::A merged migration may already have run. Add a new migration instead."
            exit 1
          fi
      - name: Keep migrations in one straight line
        run: |
          ids() { sed -n 's#.*/\([0-9]\{14\}\)_.*#\1#p' | sort -u; }
          newest=$(git ls-tree --name-only "origin/$GITHUB_BASE_REF" src/Hortiplanner.Api/Data/Migrations/ | ids | tail -1)
          for id in $(git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF...HEAD" -- src/Hortiplanner.Api/Data/Migrations | ids); do
            if [ -n "$newest" ] && [ "$id" -le "$newest" ]; then
              echo "::error::Migration $id is older than $newest on $GITHUB_BASE_REF. Update this branch and regenerate it."
              exit 1
            fi
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci
      - name: Check the generated API client is current
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts
      - name: Lint and check formatting
        run: npm run lint
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install Typst
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf /tmp/typst.tar.xz --strip-components=1 -C "$HOME/.local/bin" typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Install the browser
        run: npx playwright install --with-deps chromium webkit
      - name: Test in a real browser
        run: npm run e2e

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the container image
        run: docker build --tag hortiplanner:ci .
