<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#26391f"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b2e1c"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/logo-96.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hortiplanner</title>
    <script>
      // Before anything is drawn, so the page never flashes the wrong theme. Light unless chosen otherwise.
      let theme = "light";
      try {
        theme = localStorage.getItem("hortiplanner.theme") || "light";
      } catch {
        // Storage can be refused. Hortiplanner is then light.
      }
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
        // The browser's bar follows the chosen theme, not the device's.
        for (const meta of document.querySelectorAll(
          'meta[name="theme-color"]',
        )) {
          meta.content = theme === "dark" ? "#1b2e1c" : "#26391f";
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
